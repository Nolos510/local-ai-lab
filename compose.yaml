services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG:-v1.18.2}
    container_name: local-ai-lab-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-lc", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_IMAGE_TAG:-v0.9.6}
    container_name: local-ai-lab-open-webui
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-8080}:8080"
    environment:
      WEBUI_AUTH: "${OPEN_WEBUI_AUTH:-true}"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPENAI_API_BASE_URL: http://host.docker.internal:1234/v1
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
  open_webui_data:
