[project]
name = "local-ai-lab"
version = "0.1.0"
description = "Apple Silicon local AI engineering lab with local RAG, Qdrant, and native model runtime compatibility."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Local AI Lab" }]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "pydantic-settings>=2.5.2",
    "qdrant-client>=1.11.3",
    "uvicorn[standard]>=0.30.6",
]

[project.scripts]
local-ai-lab = "local_ai_lab.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
