[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lab-os"
version = "0.1.0"
description = "Local-first workspace for testing and documenting local AI model workflows."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "AI Lab OS maintainers" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["apps/model-dashboard"]
include = ["model_dashboard*"]

[tool.pytest.ini_options]
testpaths = ["apps/model-dashboard/tests"]
pythonpath = ["apps/model-dashboard"]
