name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python from .python-version
        if: ${{ hashFiles('.python-version') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up default Python
        if: ${{ hashFiles('.python-version') == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: |
          if [ -f pyproject.toml ]; then
            uv sync
          else
            echo "No pyproject.toml found; skipping uv sync."
          fi

      - name: Validate Docker Compose
        run: |
          if [ -f compose.yaml ] || [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
            docker compose config
          else
            echo "No compose file found; skipping Docker Compose validation."
          fi

      - name: Ruff
        run: |
          if [ -f pyproject.toml ] && grep -q "ruff" pyproject.toml; then
            uv run ruff check .
          else
            echo "Ruff is not configured; skipping lint."
          fi

      - name: Pytest
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "No tests directory found; skipping pytest."
          fi

      - name: Dashboard tests
        run: |
          if [ -d apps/model-dashboard/tests ]; then
            python3 -m unittest discover -s apps/model-dashboard/tests
          else
            echo "No dashboard tests found; skipping dashboard unittest suite."
          fi

      - name: Eval harness tests
        run: |
          if [ -d evals/local-llm-benchmark/tests ]; then
            python3 -m unittest discover -s evals/local-llm-benchmark/tests
          else
            echo "No eval harness tests found; skipping eval unittest suite."
          fi

      - name: Dashboard smoke
        run: |
          if [ -f scripts/model_dashboard_smoke.py ]; then
            python3 scripts/model_dashboard_smoke.py
          else
            echo "No dashboard smoke script found; skipping dashboard smoke."
          fi
